services:
  server:
    build:
      context: .
      target: runtime
    command: ["eclipse-claw-server", "--addr", "0.0.0.0:3000"]
    ports:
      - "127.0.0.1:${ECLIPSE_SERVER_PORT:-3000}:3000"
    environment:
      ECLIPSE_SERVER_TOKEN: ${ECLIPSE_SERVER_TOKEN:?Set a random 32+ character ECLIPSE_SERVER_TOKEN}
      ECLIPSE_REQUIRE_ISOLATED_WORKERS: "1"
      ECLIPSE_LLM_WORKER_URL: http://llm-worker:3100
      ECLIPSE_LLM_WORKER_TOKEN: ${ECLIPSE_LLM_WORKER_TOKEN:?Set a separate random 32+ character LLM worker token}
      ECLIPSE_ENABLE_CDP: ${ECLIPSE_ENABLE_CDP:-0}
      ECLIPSE_CDP_WORKER_URL: http://cdp-worker:3100
      ECLIPSE_CDP_WORKER_TOKEN: ${ECLIPSE_CDP_WORKER_TOKEN:?Set a separate random 32+ character CDP worker token}
      ECLIPSE_AUDIT_DIR: /var/lib/eclipse-claw/audit/server
      ECLIPSE_AUDIT_REQUIRED: "1"
      ECLIPSE_AUDIT_READ_ENABLED: ${ECLIPSE_AUDIT_READ_ENABLED:-0}
      ECLIPSE_AUDIT_RETENTION_DAYS: ${ECLIPSE_AUDIT_RETENTION_DAYS:-14}
      ECLIPSE_AUDIT_MAX_FILE_BYTES: ${ECLIPSE_AUDIT_MAX_FILE_BYTES:-10485760}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - audit_data:/var/lib/eclipse-claw/audit
    depends_on:
      llm-worker:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 768m
    cpus: 2.0
    networks: [service, egress]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  llm-worker:
    build:
      context: .
      target: runtime
    command: ["eclipse-claw-worker", "--mode", "llm"]
    environment:
      ECLIPSE_WORKER_TOKEN: ${ECLIPSE_LLM_WORKER_TOKEN:?Set a separate random 32+ character LLM worker token}
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ECLIPSE_AUDIT_DIR: /var/lib/eclipse-claw/audit/llm-worker
      ECLIPSE_AUDIT_REQUIRED: "1"
      ECLIPSE_AUDIT_READ_ENABLED: ${ECLIPSE_AUDIT_READ_ENABLED:-0}
      ECLIPSE_AUDIT_RETENTION_DAYS: ${ECLIPSE_AUDIT_RETENTION_DAYS:-14}
      ECLIPSE_AUDIT_MAX_FILE_BYTES: ${ECLIPSE_AUDIT_MAX_FILE_BYTES:-10485760}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - audit_data:/var/lib/eclipse-claw/audit
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    networks: [service, egress]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3100/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  cdp-worker:
    profiles: ["browser"]
    build:
      context: .
      target: cdp-worker
    command: ["eclipse-claw-worker", "--mode", "cdp"]
    environment:
      HOME: /tmp/eclipse-home
      ECLIPSE_WORKER_TOKEN: ${ECLIPSE_CDP_WORKER_TOKEN:?Set a separate random 32+ character CDP worker token}
      ECLIPSE_WORKER_DISABLE_BROWSER_SANDBOX: "1"
      ECLIPSE_AUDIT_DIR: /var/lib/eclipse-claw/audit/cdp-worker
      ECLIPSE_AUDIT_REQUIRED: "1"
      ECLIPSE_AUDIT_READ_ENABLED: ${ECLIPSE_AUDIT_READ_ENABLED:-0}
      ECLIPSE_AUDIT_RETENTION_DAYS: ${ECLIPSE_AUDIT_RETENTION_DAYS:-14}
      ECLIPSE_AUDIT_MAX_FILE_BYTES: ${ECLIPSE_AUDIT_MAX_FILE_BYTES:-10485760}
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - audit_data:/var/lib/eclipse-claw/audit
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /dev/shm:size=256m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    cpus: 2.0
    networks: [service, egress]
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3100/health"]
      interval: 30s
      timeout: 5s
      retries: 5

  ollama:
    image: ${OLLAMA_IMAGE:?Set OLLAMA_IMAGE to a pinned ollama/ollama@sha256 digest}
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    networks: [service]
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-8g}
    cpus: ${OLLAMA_CPU_LIMIT:-4.0}

networks:
  service:
    internal: true
  egress:

volumes:
  audit_data:
  ollama_data:
