name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "--cfg reqwest_unstable"

jobs:
  validate:
    name: Validate release tag and security fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
      - name: Match tag to workspace version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          test "$tag" = "$version" || {
            echo "Tag v${tag} does not match workspace version ${version}" >&2
            exit 1
          }
      - name: Verify pinned benchmark fixtures
        run: node scripts/verify-benchmark-fixtures.mjs
      - name: Run fixed security benchmarks
        run: |
          cargo test -p eclipse-claw-core --test fixed_public_benchmark
          cargo test -p eclipse-claw-llm --test fixed_security_benchmark

  build:
    name: Build ${{ matrix.target }}
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang nasm

      - name: Install aarch64 cross compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"
          echo "CMAKE_SYSTEM_NAME=Linux" >> "$GITHUB_ENV"
          echo "CMAKE_SYSTEM_PROCESSOR=aarch64" >> "$GITHUB_ENV"

      - name: Build release binaries
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package required binaries
        shell: bash
        run: |
          staging="eclipse-claw-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir "$staging"
          for binary in eclipse-claw eclipse-claw-mcp eclipse-claw-server eclipse-claw-worker; do
            test -x "target/${{ matrix.target }}/release/${binary}"
            cp "target/${{ matrix.target }}/release/${binary}" "$staging/"
          done
          cp README.md LICENSE "$staging/"
          tar czf "$staging.tar.gz" "$staging"
          echo "ASSET=$staging.tar.gz" >> "$GITHUB_ENV"

      - name: Upload release archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Collect archives and compute checksums
        shell: bash
        run: |
          find artifacts -mindepth 2 -name '*.tar.gz' -exec mv {} artifacts/ \;
          test "$(find artifacts -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 4
          (cd artifacts && sha256sum -- *.tar.gz > SHA256SUMS)
          (cd artifacts && sha256sum --check SHA256SUMS)
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/*.tar.gz
            artifacts/SHA256SUMS

  docker:
    name: Publish container images
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare Linux binaries
        shell: bash
        run: |
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            archive="$(find artifacts/$target -name '*.tar.gz' -print -quit)"
            test -n "$archive"
            tar xzf "$archive"
            source_dir="eclipse-claw-${GITHUB_REF_NAME}-${target}"
            output_dir="binaries-${target}"
            mkdir "$output_dir"
            for binary in eclipse-claw eclipse-claw-mcp eclipse-claw-server eclipse-claw-worker; do
              test -x "$source_dir/$binary"
              cp "$source_dir/$binary" "$output_dir/$binary"
            done
          done
      - name: Build signed-by-provenance architecture images
        shell: bash
        run: |
          for spec in "x86_64-unknown-linux-gnu linux/amd64 amd64" "aarch64-unknown-linux-gnu linux/arm64 arm64"; do
            read -r target platform suffix <<< "$spec"
            for variant in core cdp; do
              image="ghcr.io/pavelhopson/eclipse-claw"
              runtime_variant="core"
              if [ "$variant" = "cdp" ]; then
                image="ghcr.io/pavelhopson/eclipse-claw-cdp-worker"
                runtime_variant="cdp"
              fi
              docker buildx build \
                --file Dockerfile.ci \
                --build-arg "BINARY_DIR=binaries-${target}" \
                --build-arg "RUNTIME_VARIANT=${runtime_variant}" \
                --platform "$platform" \
                --provenance=mode=max \
                --tag "${image}:${GITHUB_REF_NAME}-${suffix}" \
                --push .
            done
          done
      - name: Publish multi-architecture manifests
        shell: bash
        run: |
          for image in ghcr.io/pavelhopson/eclipse-claw ghcr.io/pavelhopson/eclipse-claw-cdp-worker; do
            docker buildx imagetools create \
              --tag "${image}:${GITHUB_REF_NAME}" \
              --tag "${image}:latest" \
              "${image}:${GITHUB_REF_NAME}-amd64" \
              "${image}:${GITHUB_REF_NAME}-arm64"
          done

  homebrew:
    name: Update Homebrew
    needs: [release, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require tap token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: test -n "$TAP_TOKEN"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: PavelHopson/homebrew-eclipse-claw
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Download release archives and update formula
        shell: bash
        run: |
          base="https://github.com/PavelHopson/eclipse-claw/releases/download/${GITHUB_REF_NAME}"
          for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-unknown-linux-gnu x86_64-unknown-linux-gnu; do
            curl --fail --silent --show-error --location \
              "${base}/eclipse-claw-${GITHUB_REF_NAME}-${target}.tar.gz" \
              --output "${target}.tar.gz"
          done
          sha_mac_arm="$(sha256sum aarch64-apple-darwin.tar.gz | cut -d' ' -f1)"
          sha_mac_x86="$(sha256sum x86_64-apple-darwin.tar.gz | cut -d' ' -f1)"
          sha_linux_arm="$(sha256sum aarch64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)"
          sha_linux_x86="$(sha256sum x86_64-unknown-linux-gnu.tar.gz | cut -d' ' -f1)"
          mkdir -p tap/Formula
          sed \
            -e "s|@@VERSION@@|${GITHUB_REF_NAME#v}|g" \
            -e "s|@@TAG@@|${GITHUB_REF_NAME}|g" \
            -e "s|@@BASE@@|${base}|g" \
            -e "s|@@SHA_MAC_ARM@@|${sha_mac_arm}|g" \
            -e "s|@@SHA_MAC_X86@@|${sha_mac_x86}|g" \
            -e "s|@@SHA_LINUX_ARM@@|${sha_linux_arm}|g" \
            -e "s|@@SHA_LINUX_X86@@|${sha_linux_x86}|g" \
            .github/homebrew/eclipse-claw.rb.tmpl > tap/Formula/eclipse-claw.rb
      - name: Commit formula
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/eclipse-claw.rb
          git diff --cached --quiet || git commit -m "chore: update eclipse-claw to ${GITHUB_REF_NAME}"
          git push
